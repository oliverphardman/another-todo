name: Apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/client/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: apps/client/dist

  android:
    name: Android
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/client/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - name: Drop the desktop forks the React Native CLI cannot load here
        run: pnpm remove react-native-windows react-native-macos --config.frozen-lockfile=false
      - name: Generate the native project
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Decode the signing key
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Build the release bundle
        working-directory: apps/client/android
        run: ./gradlew bundleRelease assembleRelease --no-daemon
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            apps/client/android/app/build/outputs/bundle/release/*.aab
            apps/client/android/app/build/outputs/apk/release/*.apk

  ios:
    name: iOS
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/client/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Drop the desktop forks the React Native CLI cannot load here
        run: pnpm remove react-native-windows react-native-macos --config.frozen-lockfile=false
      - name: Generate the native project
        run: pnpm exec expo prebuild --platform ios --no-install
      - name: Install pods
        working-directory: apps/client/ios
        run: pod install
      - name: Build without signing
        working-directory: apps/client/ios
        run: |
          xcodebuild -workspace ./*.xcworkspace -scheme AnotherToDo -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: apps/client/ios/build/Build/Products/Release-iphoneos/*.app

  macos:
    name: macOS
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/client/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Drop the Windows fork the React Native CLI cannot load here
        run: pnpm remove react-native-windows --config.frozen-lockfile=false
      - name: Import RCTAssert in react-native-svg for macOS
        run: |
          f=$(node --print "require('path').join(require('path').dirname(require.resolve('react-native-svg/package.json')), 'apple/RNSVGUIKit.macos.mm')")
          grep -q "React/RCTAssert.h" "$f" || sed -i '' 's|#import <objc/runtime.h>|#import <objc/runtime.h>\
          #import <React/RCTAssert.h>|' "$f"
          grep -n "RCTAssert.h" "$f"
      - name: Drop the duplicate UIApplication alias in expo-modules-core
        run: |
          f="$(dirname "$(node --print "require.resolve('expo/package.json')")")"
          f=$(node --print "require('path').join(require('path').dirname(require.resolve('expo-modules-core/package.json', {paths: ['$f']})), 'ios/Platform/Platform.h')")
          sed -i '' '/^#ifndef UIApplication$/,/^#endif$/d' "$f"
          grep -c "alias UIApplication" "$f" || true
      - name: Install pods
        run: |
          for attempt in 1 2 3; do
            pod install --project-directory=macos && exit 0
            rm -rf macos/Pods macos/build
          done
          exit 1
      - name: Build without signing
        run: |
          xcodebuild -workspace macos/AnotherToDo.xcworkspace -scheme AnotherToDo-macOS \
            -configuration Release -derivedDataPath macos/build -quiet \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: apps/client/macos/build/Build/Products/Release/*.app

  windows:
    name: Windows (experimental)
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/client/pnpm-lock.yaml
      - uses: microsoft/setup-msbuild@v2
      - run: pnpm install --frozen-lockfile
      - name: Provide Base64.h where the react-native-windows patch expects it
        shell: pwsh
        run: |
          $rn = node --print "require('path').dirname(require.resolve('react-native/package.json'))"
          Copy-Item "$rn/ReactCommon/react/utils/Base64.h" "$rn/ReactCommon/jsinspector-modern/Base64.h"
      - name: Stop react-native-windows treating warnings from the newest MSVC as errors
        shell: pwsh
        run: |
          $rnw = node --print "require('path').dirname(require.resolve('react-native-windows/package.json'))"
          Get-ChildItem $rnw -Recurse -Include *.props,*.vcxproj,*.targets | ForEach-Object {
            $text = Get-Content $_.FullName -Raw
            if ($text -match '<TreatWarningAsError>true</TreatWarningAsError>') {
              $text.Replace('<TreatWarningAsError>true</TreatWarningAsError>', '<TreatWarningAsError>false</TreatWarningAsError>') | Set-Content $_.FullName -NoNewline
              "Patched $($_.FullName)"
            }
          }
      - name: Point react-native-windows at the tracing sources of react-native 0.83.10
        shell: pwsh
        run: |
          $rnw = node --print "require('path').dirname(require.resolve('react-native-windows/package.json'))"
          $file = "$rnw/Shared/Shared.vcxitems"
          $dir = '$(ReactNativeDir)\ReactCommon\jsinspector-modern\tracing'
          $old = '<ClCompile Include="' + $dir + '\TraceRecordingStateSerializer.cpp" />'
          $new = '<ClCompile Include="' + $dir + '\HostTracingProfileSerializer.cpp" />' + "`n    " + '<ClCompile Include="' + $dir + '\TraceEventGenerator.cpp" />'
          $text = Get-Content $file -Raw
          if (-not $text.Contains($old)) { throw "Entry not found in $file" }
          $text.Replace($old, $new) | Set-Content $file -NoNewline
          Select-String -Path $file -Pattern "HostTracingProfileSerializer|TraceEventGenerator"
      - name: Find the installed Windows SDK
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Directory | Where-Object { $_.Name -match '^10\.0\.\d+\.0$' } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          "WINSDK=$($sdk.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install the Universal Windows build tools
        shell: pwsh
        run: |
          $vs = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $path = (& "$vs\vswhere.exe" -latest -products * -property installationPath | Select-Object -First 1)
          "Visual Studio at: $path"
          & "$vs\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Workload.Universal -property displayName
          $arguments = @("modify", "--installPath", "`"$path`"", "--add", "Microsoft.VisualStudio.Workload.Universal", "--quiet", "--norestart", "--wait")
          $process = Start-Process -FilePath "$vs\setup.exe" -ArgumentList $arguments -Wait -PassThru
          "Installer exit code: $($process.ExitCode)"
      - name: Link native modules
        run: pnpm exec react-native autolink-windows --sln windows/AnotherToDo.sln --proj windows/AnotherToDo/AnotherToDo.vcxproj
      - name: Restore and build
        run: |
          msbuild windows/AnotherToDo.sln /restore /p:Configuration=Release /p:Platform=x64 /p:AppxBundle=Never /p:WindowsTargetPlatformVersion=$env:WINSDK /p:BundleEntryFile=index.windows.ts /p:WindowsAppSDKVerifyTransitiveDependencies=false /p:PlatformToolset=v145
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: apps/client/windows/x64/Release
