name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    name: Release PR and draft release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    env:
      APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
    steps:
      - name: Check the app is fully configured
        if: env.APP_PRIVATE_KEY != '' && vars.RELEASE_PLEASE_APP_CLIENT_ID == ''
        run: |
          echo "::error::RELEASE_PLEASE_APP_PRIVATE_KEY is set but RELEASE_PLEASE_APP_CLIENT_ID is not." \
            "Add the app's Client ID as a repository variable, then re-run."
          exit 1

      - name: Mint a token for the app
        id: app-token
        if: env.APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc  # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: Note that the release pull request will not run CI
        if: env.APP_PRIVATE_KEY == ''
        run: |
          echo "::warning::No RELEASE_PLEASE_APP_PRIVATE_KEY, so this runs as GITHUB_TOKEN. The release" \
            "pull request will not run CI. Releases still build and publish from this workflow."

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

  build:
    name: Build ${{ needs.release-please.outputs.tag_name }}
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/apps.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.release-please.outputs.sha }}

  publish:
    name: Attach the builds and publish
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: artifacts

      - name: Check every build is present
        run: |
          for name in web android ios macos windows; do
            if [ -z "$(find "artifacts/$name" -type f 2>/dev/null | head -n 1)" ]; then
              echo "::error::The $name build produced no artifact, so the release stays a draft."
              exit 1
            fi
          done

      - name: Package the assets
        run: |
          mkdir assets
          (cd artifacts/web && zip -qr "../../assets/another-todo-$TAG-web.zip" .)
          (cd artifacts/windows && zip -qr "../../assets/another-todo-$TAG-windows-x64.zip" .)
          cp artifacts/ios/ios.zip "assets/another-todo-$TAG-ios-unsigned.zip"
          cp artifacts/macos/macos.zip "assets/another-todo-$TAG-macos-arm64.zip"
          find artifacts/android -type f | while read -r file; do
            cp "$file" "assets/another-todo-$TAG-android.${file##*.}"
          done
          (cd assets && sha256sum ./* | sed 's| \./| |' > "another-todo-$TAG-sha256sums.txt")
          find assets -type f

      - name: Upload the assets to the draft release
        run: gh release upload "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Check the draft holds every asset
        run: |
          expected=$(find assets -type f | wc -l)
          uploaded=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | map(select(.state == "uploaded")) | length')
          if [ "$expected" != "$uploaded" ]; then
            echo "::error::Expected $expected assets but the draft holds $uploaded."
            exit 1
          fi

      - name: Publish the release
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  deploy:
    name: Deploy ${{ needs.release-please.outputs.tag_name }}
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      ref: ${{ needs.release-please.outputs.sha }}
