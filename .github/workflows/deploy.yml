name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Terraform and web
    runs-on: ubuntu-latest
    env:
      TF_VAR_google_client_id: ${{ vars.GOOGLE_CLIENT_ID }}
      TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      TF_VAR_microsoft_client_id: ${{ vars.MICROSOFT_CLIENT_ID }}
      TF_VAR_microsoft_client_secret: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
      TF_VAR_microsoft_issuer: ${{ vars.MICROSOFT_ISSUER }}
      TF_VAR_manage_azure_app: ${{ vars.MANAGE_AZURE_APP || 'true' }}
      TF_VAR_azure_sign_in_audience: ${{ vars.AZURE_SIGN_IN_AUDIENCE || 'PersonalMicrosoftAccount' }}
      ARM_USE_OIDC: 'true'
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            apps/api/pnpm-lock.yaml
            apps/client/pnpm-lock.yaml

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_wrapper: false

      - name: Install and build the API
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
        working-directory: apps/api

      - name: Init
        run: terraform init -input=false
        working-directory: infra

      - name: Plan
        run: terraform plan -input=false -out=tfplan
        working-directory: infra

      - name: Apply
        run: terraform apply -input=false tfplan
        working-directory: infra

      - name: Install the client
        run: pnpm install --frozen-lockfile
        working-directory: apps/client

      - name: Build and publish the web client
        run: infra/deploy-web.sh
